name: safesafar_map
description: "SafeSafar Mobile Map, Safe Routing, Landmarks, Dead-zone detection & Offline Caching Module (Dhruv Raval)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/surat_landmarks.json
    - assets/data/surat_dead_zones.json
    - assets/data/surat_reports.json
    - assets/data/surat_demo_routes.json
